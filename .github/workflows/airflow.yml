name: Airflow rule checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: /tmp/dota-airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-airflow.txt
      - name: Install isolated Airflow test dependencies
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -r requirements-airflow.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.14.txt
          python -m pip check
      - name: Verify runner, offline assets and Airflow DAG parsing
        run: |
          rm -f evidence/step7/runner_tests.json evidence/step7/dag_tests.json
          python tests/test_orchestration.py
          python tests/test_airflow_dags.py
      - name: Upload orchestration fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-rule-checks
          path: |
            evidence/step7/runner_tests.json
            evidence/step7/dag_tests.json
          if-no-files-found: warn
          retention-days: 14
