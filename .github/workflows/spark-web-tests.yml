name: Kiểm thử Spark, ML, website và streaming

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rules:
    name: Fixture — Silver, Gold, mô hình và API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare fresh CI reports and logs
        run: |
          mkdir -p artifacts/ci/spark-web
          rm -f evidence/step2/rule_tests.json evidence/step3/rule_tests.json evidence/step4/feature_tests.json evidence/step4/training_tests.json evidence/step4/inference_tests.json evidence/step5/api_tests.json evidence/step5/display_tests.json evidence/step5/export_tests.json evidence/step6/api_tests.json evidence/step6/rule_tests.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/spark.txt
            requirements/web.txt
            requirements/web-test.txt
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Spark and web test dependencies
        run: python -m pip install -r requirements/spark.txt -r requirements/web-test.txt 2>&1 | tee artifacts/ci/spark-web/dependencies.log
      - name: Check Python syntax
        run: python -m compileall -q pipeline analytics ml web streaming orchestration scripts tests 2>&1 | tee artifacts/ci/spark-web/source-checks.log
      - name: Check web API and portable serving using local fixtures
        run: |
          python tests/test_web_api.py 2>&1 | tee artifacts/ci/spark-web/test_web_api.log
          python tests/test_streaming_api.py 2>&1 | tee artifacts/ci/spark-web/test_streaming_api.log
          node tests/test_web_logic.mjs 2>&1 | tee artifacts/ci/spark-web/test_web_logic.log
      - name: Validate normalization rules using synthetic data
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_prepare_match_drafts.py 2>&1 | tee artifacts/ci/spark-web/test_prepare_match_drafts.log
      - name: Validate Gold statistics using synthetic data
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_draft_stats.py 2>&1 | tee artifacts/ci/spark-web/test_draft_stats.log
      - name: Validate deterministic ML features
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_ml_features.py 2>&1 | tee artifacts/ci/spark-web/test_ml_features.log
      - name: Train and reload ML models on synthetic data
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_ml_training.py 2>&1 | tee artifacts/ci/spark-web/test_ml_training.log
      - name: Validate portable prediction without Spark dependencies
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_ml_inference.py 2>&1 | tee artifacts/ci/spark-web/test_ml_inference.log
      - name: Verify web snapshot export using synthetic local Parquet
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_web_export.py 2>&1 | tee artifacts/ci/spark-web/test_web_export.log
      - name: Verify streaming checkpoint recovery using synthetic file source
        run: |
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_streaming_checkpoint_recovery.py 2>&1 | tee artifacts/ci/spark-web/test_streaming_checkpoint_recovery.log
      - name: Summarize CI scope and fresh results
        if: always()
        run: python scripts/write_ci_summary.py --suite spark-web --job-status "${{ job.status }}"
      - name: Package fresh fixture evidence with provenance
        if: always()
        run: python scripts/package_evidence.py --kind ci_fixture --suite spark-web --logs artifacts/ci/spark-web --output artifacts/evidence-bundles/spark-web --job-status "${{ job.status }}"
      - name: Downloadable Spark and web evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bang-chung-ci-spark-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-bundles/spark-web
          if-no-files-found: error
          retention-days: 14
