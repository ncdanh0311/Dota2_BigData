name: Kiểm tra mã nguồn và đóng gói bằng chứng

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository:
    name: JSON, PowerShell và hợp đồng artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare fresh CI reports and logs
        run: |
          mkdir -p artifacts/ci/repository
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Validate JSON and tracked file policy
        run: python scripts/check_repository.py 2>&1 | tee artifacts/ci/repository/source-checks.log
      - name: Check summary failure reporting
        run: |
          python tests/test_ci_summary.py 2>&1 | tee artifacts/ci/repository/summary-tests.log
          python tests/test_evidence_packaging.py 2>&1 | tee artifacts/ci/repository/evidence-packaging-tests.log
          python tests/test_integration_reporting.py 2>&1 | tee artifacts/ci/repository/integration-reporting-tests.log
      - name: Parse PowerShell scripts without launching WSL or services
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0 -or $paths.Count -eq 0) { throw 'Cannot enumerate PowerShell scripts.' }
          $allErrors = @()
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) { $allErrors | Format-List; throw 'PowerShell syntax check failed.' }
          Write-Host "PowerShell syntax PASS: $($paths.Count) scripts"
      - name: Summarize CI scope and fresh results
        if: always()
        run: python scripts/write_ci_summary.py --suite repository --job-status "${{ job.status }}"
      - name: Package repository check evidence
        if: always()
        run: python scripts/package_evidence.py --kind ci_fixture --suite repository --logs artifacts/ci/repository --output artifacts/evidence-bundles/repository --job-status "${{ job.status }}"
      - name: Downloadable repository check evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bang-chung-ci-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-bundles/repository
          if-no-files-found: error
          retention-days: 14
