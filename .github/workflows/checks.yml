name: Spark rule checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Spark dependency
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q pipeline analytics scripts tests
      - name: Validate normalization rules using synthetic data
        run: |
          rm -f evidence/step2/rule_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_prepare_match_drafts.py
      - name: Validate Gold statistics using synthetic data
        run: |
          rm -f evidence/step3/rule_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_draft_stats.py
      - name: Upload rule-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-rule-checks
          path: |
            evidence/step2/rule_tests.json
            evidence/step3/rule_tests.json
          if-no-files-found: warn
          retention-days: 14
