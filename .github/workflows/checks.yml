name: Spark and web rule checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Spark and web test dependencies
        run: python -m pip install -r requirements.txt -r requirements-web-test.txt
      - name: Check Python syntax
        run: python -m compileall -q pipeline analytics ml web streaming orchestration scripts tests
      - name: Check web API and portable serving using local fixtures
        run: |
          rm -f evidence/step5/api_tests.json evidence/step5/display_tests.json evidence/step6/api_tests.json evidence/step6/rule_tests.json
          python tests/test_web_api.py
          python tests/test_streaming_api.py
          node tests/test_web_logic.mjs
      - name: Validate normalization rules using synthetic data
        run: |
          rm -f evidence/step2/rule_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_prepare_match_drafts.py
      - name: Validate Gold statistics using synthetic data
        run: |
          rm -f evidence/step3/rule_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_draft_stats.py
      - name: Validate deterministic ML features
        run: |
          rm -f evidence/step4/feature_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_ml_features.py
      - name: Train and reload ML models on synthetic data
        run: |
          rm -f evidence/step4/training_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_ml_training.py
      - name: Validate portable prediction without Spark dependencies
        run: |
          rm -f evidence/step4/inference_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_ml_inference.py
      - name: Verify web snapshot export using synthetic local Parquet
        run: |
          rm -f evidence/step5/export_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_web_export.py
      - name: Verify streaming checkpoint recovery using synthetic file source
        run: |
          rm -f evidence/step6/rule_tests.json
          spark-submit --master 'local[2]' --driver-memory 1g \
            --conf spark.driver.host=127.0.0.1 \
            --conf spark.driver.bindAddress=127.0.0.1 \
            tests/test_streaming.py
      - name: Upload rule-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-rule-checks
          path: |
            evidence/step2/rule_tests.json
            evidence/step3/rule_tests.json
            evidence/step4/feature_tests.json
            evidence/step4/training_tests.json
            evidence/step4/inference_tests.json
            evidence/step5/api_tests.json
            evidence/step5/display_tests.json
            evidence/step5/export_tests.json
            evidence/step6/rule_tests.json
            evidence/step6/api_tests.json
          if-no-files-found: warn
          retention-days: 14
