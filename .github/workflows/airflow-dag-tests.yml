name: Airflow rule checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: /tmp/dota-airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fresh CI reports and logs
        run: |
          mkdir -p artifacts/ci/airflow
          rm -f evidence/step7/runner_tests.json evidence/step7/dag_tests.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-airflow.txt
      - name: Install isolated Airflow test dependencies
        run: |
          python -m pip install pip==26.2.2 2>&1 | tee artifacts/ci/airflow/pip-bootstrap.log
          python -m pip install -r requirements-airflow.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.14.txt 2>&1 | tee artifacts/ci/airflow/dependencies.log
          python -m pip check 2>&1 | tee artifacts/ci/airflow/pip-check.log
      - name: Verify runner, offline assets and Airflow DAG parsing
        run: |
          python tests/test_workflow_job_runner.py 2>&1 | tee artifacts/ci/airflow/test_workflow_job_runner.log
          python tests/test_airflow_dags.py 2>&1 | tee artifacts/ci/airflow/test_airflow_dags.log
      - name: Summarize CI scope and fresh results
        if: always()
        run: python scripts/write_ci_summary.py --suite airflow --job-status "${{ job.status }}"
      - name: Upload orchestration fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-fixture-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/step7/runner_tests.json
            evidence/step7/dag_tests.json
            artifacts/ci/airflow
          if-no-files-found: warn
          retention-days: 14
